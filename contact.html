<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تواصل معنا — العربية للشوكلاطه</title>
  <meta name="description" content="تواصل مع العربية للشوكلاطه للطلبات والمناسبات." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="contact">
  <div class="scroll-progress" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="العربية للشوكلاطه">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">
          <span class="logo-name">العربية للشوكلاطه</span>
          <span class="logo-tag" data-i18n="logo.tag"></span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="index.html" data-i18n="nav.home"></a>
        <a href="index.html#story" data-i18n="nav.story"></a>
        <a href="products.html" data-i18n="nav.products"></a>
        <a href="contact.html" data-i18n="nav.contact" aria-current="page"></a>
      </nav>
      <div class="header-actions">
        <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">עברית</button>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="page-hero-deco" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="container">
        <p class="eyebrow" data-i18n="cp.eyebrow"></p>
        <h1 data-i18n="cp.title"></h1>
        <p class="lead" data-i18n="cp.lead"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <!-- Shown only when arriving from a product (contact.html?product=id) -->
        <div class="selected" id="selectedProduct" hidden>
          <div class="selected-media" id="selMedia"></div>
          <div class="selected-body">
            <p class="eyebrow" data-i18n="sel.label"></p>
            <h2 id="selName"></h2>
            <p class="selected-price" id="selPrice"></p>
            <div class="selected-actions">
              <a href="#" class="btn btn-primary" id="selSend" target="_blank" rel="noopener" data-i18n="sel.send"></a>
              <a href="products.html" class="btn btn-ghost" data-i18n="sel.change"></a>
            </div>
          </div>
        </div>

        <div class="channels">
          <a href="#" class="channel js-wa-general">
            <span class="channel-icon wa" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2Zm5.8 14.03c-.24.68-1.42 1.3-1.96 1.35-.5.05-.97.24-3.27-.68-2.77-1.090-4.52-3.93-4.66-4.11-.13-.18-1.11-1.48-1.11-2.83s.7-2.01.96-2.28c.24-.27.53-.34.71-.34l.51.01c.16 0 .38-.06.6.46.24.55.8 1.92.87 2.06.07.14.11.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.13-.28.28-.12.55.16.27.71 1.17 1.52 1.9 1.05.93 1.930 1.22 2.2 1.36.27.13.43.11.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.23.6-.14.25.09 1.58.75 1.85.88.27.14.45.2.52.32.07.11.07.66-.17 1.33Z"/></svg>
            </span>
            <h3 data-i18n="ch.wa"></h3>
            <p data-i18n="ch.waD"></p>
          </a>
          <a href="#" class="channel js-phone-link">
            <span class="channel-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>
            </span>
            <h3 data-i18n="ch.phone"></h3>
            <p class="js-phone-text" dir="ltr"></p>
          </a>
          <a href="#" class="channel js-instagram-link" target="_blank" rel="noopener">
            <span class="channel-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4Zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0ZM21.9 8c-.1-1.6-.4-3-1.6-4.2S17.6 2.2 16 2.1C14.4 2 9.6 2 8 2.1 6.4 2.2 5 2.5 3.8 3.7S2.2 6.4 2.1 8C2 9.6 2 14.4 2.1 16c.1 1.6.4 3 1.6 4.2s2.6 1.5 4.2 1.6c1.6.1 6.4.1 8 0 1.6-.1 3-.4 4.2-1.6s1.5-2.6 1.6-4.2c.1-1.6.1-6.4 0-8Zm-2.1 9.8a3.3 3.3 0 0 1-1.9 1.9c-1.3.5-4.4.4-5.9.4s-4.6.1-5.9-.4a3.3 3.3 0 0 1-1.9-1.9c-.5-1.3-.4-4.4-.4-5.9s-.1-4.6.4-5.9a3.300 3.3 0 0 1 1.9-1.9c1.3-.5 4.4-.4 5.9-.4s4.6-.1 5.9.4a3.3 3.3 0 0 1 1.9 1.9c.5 1.3.4 4.4.4 5.9s.1 4.6-.4 5.9Z"/></svg>
            </span>
            <h3 data-i18n="ch.ig"></h3>
            <p class="js-instagram-text" dir="ltr"></p>
          </a>
        </div>

        <div class="visit">
          <div class="visit-info">
            <p class="eyebrow" data-i18n="ch.visit"></p>
            <h2 data-i18n="visit.title"></h2>
            <dl class="info">
              <div><dt data-i18n="contact.addrL"></dt><dd data-i18n="contact.addr"></dd></div>
              <div><dt data-i18n="contact.hoursL"></dt><dd data-i18n="contact.hours"></dd></div>
            </dl>
            <div class="map-actions">
              <a href="#" class="btn btn-ghost js-waze-link" target="_blank" rel="noopener" data-i18n="map.waze"></a>
              <a href="#" class="btn btn-ghost js-google-link" target="_blank" rel="noopener" data-i18n="map.google"></a>
            </div>
          </div>
          <div class="map" id="map"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="logo-name">العربية للشوكلاطه</span>
      <nav class="footer-nav">
        <a href="index.html" data-i18n="nav.home"></a>
        <a href="products.html" data-i18n="nav.products"></a>
        <a href="contact.html" data-i18n="nav.contact"></a>
      </nav>
      <span>© <span class="js-year"></span> · <span data-i18n="footer.rights"></span></span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script src="js/motion.js"></script>
</body>
</html>

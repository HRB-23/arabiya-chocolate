<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>منتجاتنا — العربية للشوكلاطه</title>
  <meta name="description" content="بوكسات، ألواح، نكهات عربية وتوزيعات مناسبات من العربية للشوكلاطه." />
  <link rel="icon" href="assets/logo/favicon-48.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="products">
  <div class="scroll-progress" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="العربية للشوكلاطه">
        <img class="logo-mark" src="assets/logo/logo-mark.webp" alt="" width="38" height="44" />
        <span class="logo-text">
          <span class="logo-name">العربية للشوكلاطه</span>
          <span class="logo-tag" data-i18n="logo.tag"></span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="index.html" data-i18n="nav.home"></a>
        <a href="index.html#story" data-i18n="nav.story"></a>
        <a href="products.html" data-i18n="nav.products" aria-current="page"></a>
        <a href="contact.html" data-i18n="nav.contact"></a>
      </nav>
      <div class="header-actions">
        <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">עברית</button>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="page-hero-deco" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="container">
        <p class="eyebrow" data-i18n="pp.eyebrow"></p>
        <h1 data-i18n="pp.title"></h1>
        <p class="lead" data-i18n="pp.lead"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters" id="filters" role="tablist"></div>
        <div class="grid" id="productGrid"></div>
      </div>
    </section>

    <section class="section section-alt" id="flavours">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-i18n="menu.eyebrow"></p>
          <h2 data-i18n="menu.title"></h2>
          <p class="lead" data-i18n="menu.lead"></p>
        </div>
        <div class="flavours-grid" id="flavoursGrid"></div>
        <div class="center">
          <a href="#" class="btn btn-primary js-flavours-wa" target="_blank" rel="noopener" data-i18n="menu.cta"></a>
        </div>
      </div>
    </section>

    <section class="section section-dark" id="order">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-i18n="order.eyebrow"></p>
          <h2 data-i18n="order.title"></h2>
        </div>
        <ol class="steps">
          <li><span class="step-num">١</span><h3 data-i18n="order.s1t"></h3><p data-i18n="order.s1d"></p></li>
          <li><span class="step-num">٢</span><h3 data-i18n="order.s2t"></h3><p data-i18n="order.s2d"></p></li>
          <li><span class="step-num">٣</span><h3 data-i18n="order.s3t"></h3><p data-i18n="order.s3d"></p></li>
        </ol>
        <div class="center"><a href="contact.html" class="btn btn-gold" data-i18n="cta.btn"></a></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <img class="footer-logo" src="assets/logo/logo-on-dark.webp" alt="العربية للشوكلاطه" width="120" height="178" />
      <nav class="footer-nav">
        <a href="index.html" data-i18n="nav.home"></a>
        <a href="products.html" data-i18n="nav.products"></a>
        <a href="contact.html" data-i18n="nav.contact"></a>
      </nav>
      <span>© <span class="js-year"></span> · <span data-i18n="footer.rights"></span></span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script src="js/motion.js"></script>
</body>
</html>
